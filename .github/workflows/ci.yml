name: Validate FjordCasino
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests -q
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_smoke.py
      - run: python tests/browser_presence.py
      - run: python tests/browser_background_presence.py
      - run: python tests/browser_poker.py
      - run: docker build -t fjordcasino:test .
      - name: Container readiness
        run: |
          docker run -d --name casino-smoke -e AUTH_MODE=local -p 127.0.0.1:8070:8080 fjordcasino:test
          for attempt in $(seq 1 30); do
            if curl --fail http://127.0.0.1:8070/api/health; then exit 0; fi
            sleep 1
          done
          docker logs casino-smoke
          exit 1
      - if: always()
        run: docker rm -f casino-smoke || true
